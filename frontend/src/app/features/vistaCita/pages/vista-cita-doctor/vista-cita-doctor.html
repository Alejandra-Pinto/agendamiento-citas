<div class="max-w-[1400px] mx-auto p-6 space-y-8 bg-[#DFE6E6]">

  <app-agendamiento-estados-citas
    [estadoActual]="cita?.estado"
    (alCambiarEstado)="onEstadoChanged($event)"
    (alReagendar)="redirigirANuevoAgendamiento()">
  </app-agendamiento-estados-citas>

  <app-agendamiento-info-medico
    [citaInfo]="cita">
  </app-agendamiento-info-medico>

  <div class="bg-[#1e4cd6] p-5 rounded-xl shadow-md text-white flex items-center gap-4 relative overflow-hidden">
    <div class="bg-white/20 p-2 rounded-lg relative z-10">
      <span class="material-symbols-outlined">priority_high</span>
    </div>
    <div class="relative z-10">
      <p class="text-[10px] font-black uppercase tracking-widest opacity-70">Nota del Sistema</p>
      <p class="font-bold text-sm">Verificar historial de alergias antes de prescribir medicamentos.</p>
    </div>
    <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/5 rounded-full"></div>
  </div>

  <div>
    <app-agendamiento-info-panel-notas
      [citaInfo]="cita">
    </app-agendamiento-info-panel-notas>
  </div>

</div>
