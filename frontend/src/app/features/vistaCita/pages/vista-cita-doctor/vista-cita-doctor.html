<div class="max-w-[1400px] mx-auto p-6 space-y-8">

  <!-- 1. CABECERA Y ESTADOS -->
  <app-agendamiento-estados-citas
    [estadoActual]="cita?.estado"
    (alCambiarEstado)="onEstadoChanged($event)">
  </app-agendamiento-estados-citas>

  <!-- 2. FILA DE 3 TARJETAS (Ancho completo) -->
  <app-agendamiento-info-medico
    [citaInfo]="cita">
  </app-agendamiento-info-medico>

  <!-- 3. NOTA DEL SISTEMA (Con margen extra para separar) -->
  <div
    class="bg-[#1e4cd6] p-5 rounded-xl shadow-md text-white flex items-center gap-4 relative overflow-hidden mb-4">
    <div class="bg-white/20 p-2 rounded-lg relative z-10">
      <span class="material-symbols-outlined">priority_high</span>
    </div>
    <div class="relative z-10">
      <p
        class="text-[10px] font-black uppercase tracking-widest opacity-70">Nota
        del Sistema</p>
      <p class="font-bold text-sm">Verificar historial de alergias antes de
        prescribir medicamentos.</p>
    </div>
    <!-- Decoración sutil -->
    <div
      class="absolute -right-8 -top-8 w-32 h-32 bg-white/5 rounded-full"></div>
  </div>

  <!-- 4. PANEL DE NOTAS (Ahora con aire respecto a la nota azul) -->
  <div class="pt-2">
    <app-agendamiento-info-panel-notas
      [citaInfo]="cita">
    </app-agendamiento-info-panel-notas>
  </div>

</div>
