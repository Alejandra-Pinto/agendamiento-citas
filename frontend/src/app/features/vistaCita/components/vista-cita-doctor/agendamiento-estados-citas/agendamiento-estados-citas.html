<div
  class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-8">
  <div>
    <h2 class="text-3xl font-black tracking-tight text-on-surface mb-2">Detalle
      de la Cita</h2>
    <p class="text-slate-500 font-medium">
      Gestiona y consulta la información detallada del paciente.
    </p>
  </div>

  <div class="flex flex-wrap gap-2">
    <button
      [ngClass]="colorEstado"
      class="px-4 py-2 rounded-full text-xs font-bold border flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-current animate-pulse"></span>
      {{ estadoActual }}
    </button>

    <div class="relative group">
      <button
        class="p-2 bg-white shadow-sm border border-slate-100 rounded-lg flex items-center gap-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
        <span class="material-symbols-outlined text-sm">edit</span>
        Cambiar Estado
      </button>
      <!-- PROGRAMA -->
      <div
        class="absolute right-0 mt-2 w-48 bg-white shadow-xl rounded-xl p-2 border border-slate-100 hidden group-hover:block z-50">
        <div
          (click)="cambiarEstado('PROGRAMADA')"
          class="p-2 hover:bg-blue-50 rounded-lg cursor-pointer flex items-center gap-3 text-xs font-bold text-blue-600">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span> PROGRAMADA
        </div>
        <!-- FINALIZADA -->
        <div
          (click)="cambiarEstado('FINALIZADA')"
          class="p-2 hover:bg-emerald-50 rounded-lg cursor-pointer flex items-center gap-3 text-xs font-bold text-emerald-600">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> FINALIZADA
        </div>
        <!-- REAGENDADA -->
        <div
          (click)="cambiarEstado('REAGENDADA')"
          class="p-2 hover:bg-amber-50 rounded-lg cursor-pointer flex items-center gap-3 text-xs font-bold text-amber-600">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> REAGENDADA
        </div>
        <div class="my-1 border-t border-slate-100"></div>
        <!-- CANCELADA -->
        <div
          (click)="cambiarEstado('CANCELADA')"
          class="p-2 hover:bg-red-50 rounded-lg cursor-pointer flex items-center gap-3 text-xs font-bold text-red-600">
          <span class="w-2 h-2 rounded-full bg-red-500"></span> CANCELADA
        </div>
      </div>
    </div>
  </div>
</div>
