@if (citaInfo) {
<div
  class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col h-full border border-outline-variant">
  <div
    class="px-8 py-4 bg-surface-container/50 border-b border-outline-variant flex justify-between items-center">
    <h3
      class="font-bold text-on-surface flex items-center gap-2 text-sm uppercase tracking-wider">
      <span class="material-symbols-outlined text-primary">description</span>
      Notas de la Consulta
    </h3>
    <div
      class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
      Piedra Azul - Historia
    </div>
  </div>

  <div class="p-8">
    <textarea
      [(ngModel)]="citaInfo.notas"
      class="w-full min-h-[300px] border-none focus:ring-0 p-0 text-lg leading-relaxed text-on-surface-variant placeholder:text-slate-500 resize-none bg-transparent"
      placeholder="Inicie el registro de la consulta aquí (síntomas, diagnóstico, evolución)...">
    </textarea>

    <div class="mt-6 flex justify-end">
      <button
        (click)="guardarNotasLocales()"
        class="flex items-center gap-2 bg-primary text-white px-6 py-2 rounded-xl font-bold text-sm hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20">
        <span class="material-symbols-outlined text-sm">save</span>
        Guardar Observaciones
      </button>
    </div>
  </div>
</div>
} @else {
<div
  class="animate-pulse bg-white h-[450px] rounded-xl shadow-sm border border-outline-variant"></div>
}
