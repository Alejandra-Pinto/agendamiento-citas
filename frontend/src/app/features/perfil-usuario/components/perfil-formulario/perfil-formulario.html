<div class="space-y-4">
  <div class="flex items-center gap-2 mb-2">
    <span class="material-symbols-outlined text-on-surface-variant text-[20px]"
      >person_outline</span
    >
    <h2 class="text-[14px] font-bold text-on-surface-variant uppercase tracking-widest">
      Información del Paciente
    </h2>
  </div>

  <div class="bg-surface-container-low rounded-xl p-6 shadow-sm space-y-5">
    <div class="grid grid-cols-1 gap-5">
      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Nombres</label
        >
        <input
          [(ngModel)]="paciente.nombres"
          type="text"
          class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
        />
      </div>
      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Apellidos</label
        >
        <input
          [(ngModel)]="paciente.apellidos"
          type="text"
          class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
        />
      </div>
    </div>
    <div class="group">
      <label
        class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
        >Documento (ID)</label
      >
      <div class="relative">
        <input
          [value]="paciente.documento"
          readonly
          type="text"
          class="w-full bg-surface-container/50 border-none rounded-lg px-4 py-3 text-[14px] font-medium text-on-surface-variant/70 cursor-not-allowed outline-none"
        />
        <span
          class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-[18px]"
          >lock</span
        >
      </div>
    </div>

    <div class="group">
      <label
        class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
        >Celular</label
      >
      <input
        [(ngModel)]="paciente.celular"
        type="tel"
        class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
      />
    </div>

    <div class="group">
      <label
        class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
        >Correo Electrónico</label
      >
      <input
        [(ngModel)]="paciente.email"
        type="email"
        class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
      />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Género</label
        >
        <div class="relative">
          <select
            [(ngModel)]="paciente.genero"
            class="w-full appearance-none bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
          >
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
          <span
            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[18px]"
            >expand_more</span
          >
        </div>
      </div>
      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Nacimiento</label
        >
        <input
          [(ngModel)]="paciente.nacimiento"
          type="text"
          class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
        />
      </div>
    </div>
  </div>
</div>
