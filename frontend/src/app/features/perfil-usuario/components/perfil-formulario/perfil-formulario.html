<div class="space-y-6">
  <div class="space-y-4">
    <div class="flex items-center gap-2 mb-2">
      <span class="material-symbols-outlined text-on-surface-variant text-[20px]"
        >person_outline</span
      >
      <h2 class="text-[14px] font-bold text-on-surface-variant uppercase tracking-widest">
        Información del Paciente
      </h2>
    </div>

    <div class="bg-surface-container-low rounded-xl p-6 shadow-sm space-y-5">
      <div class="grid grid-cols-1 gap-5">
        <div class="group">
          <label
            class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
            >Nombres</label
          >
          <input
            [(ngModel)]="paciente.nombres"
            type="text"
            class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
          />
        </div>
        <div class="group">
          <label
            class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
            >Apellidos</label
          >
          <input
            [(ngModel)]="paciente.apellidos"
            type="text"
            class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
          />
        </div>
      </div>
      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Documento (ID)</label
        >
        <div class="relative">
          <input
            [value]="paciente.documento"
            readonly
            type="text"
            class="w-full bg-surface-container/50 border-none rounded-lg px-4 py-3 text-[14px] font-medium text-on-surface-variant/70 cursor-not-allowed outline-none"
          />
          <span
            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-[18px]"
            >lock</span
          >
        </div>
      </div>

      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Celular</label
        >
        <input
          [(ngModel)]="paciente.celular"
          type="tel"
          class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
        />
      </div>

      <div class="group">
        <label
          class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
          >Correo Electrónico</label
        >
        <input
          [(ngModel)]="paciente.email"
          type="email"
          class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="group">
          <label
            class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
            >Género</label
          >
          <div class="relative">
            <select
              [(ngModel)]="paciente.genero"
              class="w-full appearance-none bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
            >
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
            <span
              class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[18px]"
              >expand_more</span
            >
          </div>
        </div>
      </div>

      <div class="pt-4 mt-2 border-t border-slate-100 flex justify-end">
        <button
          (click)="emitirGuardarDatos()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md shadow-blue-600/20 active:scale-95 transition-all flex items-center gap-2 text-[13px]"
        >
          <span class="material-symbols-outlined text-[18px]">save</span>
          Guardar Cambios
        </button>
      </div>
    </div>
  </div>

  <div class="space-y-4 mt-6">
    <div class="flex items-center gap-2 mb-2">
      <span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
      <h2 class="text-[14px] font-bold text-on-surface-variant uppercase tracking-widest">
        Seguridad
      </h2>
    </div>

    <div class="bg-surface-container-low rounded-xl p-6 shadow-sm space-y-4">
      <button
        (click)="toggleContrasena()"
        class="flex items-center justify-between w-full p-3 rounded-lg hover:bg-slate-50 transition-colors text-left group"
      >
        <div class="flex items-center gap-3 text-blue-600 font-bold">
          <span class="material-symbols-outlined">{{
            mostrarCambioContrasena ? 'lock_open' : 'key'
          }}</span>
          <span class="text-[14px]">Cambiar mi contraseña</span>
        </div>
        <span
          class="material-symbols-outlined text-slate-400 group-hover:text-blue-600 transition-colors"
        >
          {{ mostrarCambioContrasena ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}
        </span>
      </button>

      @if (mostrarCambioContrasena) {
        <div
          class="pt-4 border-t border-slate-100 space-y-5 animate-in slide-in-from-top-2 duration-300"
        >
          <div class="group">
            <label
              class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
              >Nueva Contraseña</label
            >
            <input
              [(ngModel)]="paciente.nuevaContrasena"
              type="password"
              placeholder="Escribe tu nueva contraseña"
              class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
            />
          </div>

          <div class="group">
            <label
              class="block text-[11px] font-bold text-on-surface-variant uppercase tracking-tighter mb-1 ml-1"
              >Confirmar Contraseña</label
            >
            <input
              [(ngModel)]="paciente.confirmarContrasena"
              type="password"
              placeholder="Repite tu nueva contraseña"
              class="w-full bg-surface-container border-none rounded-lg px-4 py-3 text-[14px] font-medium focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all duration-200 outline-none text-on-surface"
            />

            @if (
              paciente.nuevaContrasena &&
              paciente.confirmarContrasena &&
              paciente.nuevaContrasena !== paciente.confirmarContrasena
            ) {
              <p class="text-red-500 text-[11px] mt-2 ml-1 font-bold">
                Las contraseñas no coinciden.
              </p>
            }
          </div>

          <div class="pt-2 flex justify-end">
            <button
              (click)="emitirGuardarContrasena()"
              [disabled]="
                !paciente.nuevaContrasena ||
                paciente.nuevaContrasena !== paciente.confirmarContrasena
              "
              class="bg-slate-800 hover:bg-slate-900 disabled:bg-slate-300 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-bold py-2.5 px-6 rounded-lg shadow-md active:scale-95 transition-all flex items-center gap-2 text-[13px]"
            >
              <span class="material-symbols-outlined text-[18px]">key</span>
              Actualizar Contraseña
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
