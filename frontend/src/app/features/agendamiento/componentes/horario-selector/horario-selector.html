<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div class="space-y-2">
    <label class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Fecha de Cita*</label>
    
    <mat-form-field appearance="outline" class="w-full custom-datepicker">
      <input matInput 
             [matDatepicker]="picker" 
             [matDatepickerFilter]="filtroFechas"
             [(ngModel)]="fecha"
             (dateChange)="onFechaChange($event)"
             placeholder="Seleccione una fecha">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="space-y-2">
    <label class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Horario Disponible*</label>
    <select
      class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"
      [ngModel]="horaSeleccionada"
      (ngModelChange)="onHoraChange($event)"
    >
      <option value="" disabled selected>Seleccione una hora</option>
      <option *ngFor="let h of horarios" [value]="convertirHora(h.hora)">
        {{ h.hora }}
      </option>
    </select>
  </div>
</div>
