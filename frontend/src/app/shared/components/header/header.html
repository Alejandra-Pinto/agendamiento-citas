<header
  class="w-full sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm flex items-center justify-between px-4 md:px-8 py-3 md:py-4"
>
  <div class="flex items-center gap-3 md:gap-8 flex-1 md:flex-none">
    
    <button
  type="button"
  (click)="alternarMenu()"
  class="md:hidden p-2 bg-slate-50 active:bg-slate-100 rounded-xl border border-slate-200 text-slate-600 transition-all flex items-center justify-center relative z-50"
>
  <span class="material-symbols-outlined text-[22px]">menu</span>
</button>

    <div>
      <h2 class="text-base md:text-xl font-bold tracking-tight text-slate-900 whitespace-nowrap">
        Agendar Cita
      </h2>
    </div>

    <div class="relative hidden sm:block">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-sm">
        search
      </span>
      <input
        class="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-xs w-40 md:w-64 focus:ring-2 focus:ring-blue-500 transition-all"
        placeholder="Buscar..."
        type="text"
      />
    </div>
  </div>

  <div class="flex items-center gap-2 md:gap-4">
    
    <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-full transition-colors sm:hidden">
      <span class="material-symbols-outlined">search</span>
    </button>

    <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-full transition-colors relative">
      <span class="material-symbols-outlined text-[22px]">notifications</span>
      <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
    </button>
    
    <button class="p-2 text-slate-500 hover:bg-slate-50 rounded-full transition-colors hidden md:block">
      <span class="material-symbols-outlined text-[22px]">help</span>
    </button>

    <div class="h-6 w-[1px] bg-slate-200 mx-1 md:mx-2"></div>

    <div class="flex items-center gap-2 md:gap-3 cursor-pointer hover:bg-slate-50 p-1 md:pr-3 rounded-full transition-colors">
      <div class="w-9 h-9 md:w-11 md:h-11 rounded-full flex-shrink-0 flex items-center justify-center border-2 border-blue-200 bg-blue-50 transition-colors">
        <span class="text-blue-700 font-extrabold text-sm md:text-base uppercase select-none">
          {{ 
            username().split(' ').length > 1 && (username().toLowerCase().startsWith('dr')) 
            ? username().split(' ')[1].charAt(0) 
            : username().charAt(0) 
          }}
        </span>
      </div>
      <div class="hidden lg:block">
        <p class="text-xs font-bold text-slate-900 leading-none">{{ username() }}</p>
        <p class="text-[10px] text-slate-500 font-medium mt-0.5">{{ mainRole() }}</p>
      </div>
    </div>
  </div>
</header>
