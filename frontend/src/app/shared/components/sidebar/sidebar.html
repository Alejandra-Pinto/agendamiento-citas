<!-- Botón hamburguesa -->
<button
  (click)="toggleSidebar()"
  class="md:hidden fixed top-4 left-4 z-50 p-2 bg-white rounded-xl shadow-md border border-slate-200 text-slate-600 hover:text-blue-600 transition-colors flex items-center justify-center"
>
  <span class="material-symbols-outlined">menu</span>
</button>

<!-- Overlay -->
@if (isSidebarOpen) {
  <div
    (click)="closeSidebar()"
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 md:hidden"
  ></div>
}

<!-- Sidebar panel -->
<aside
  class="fixed md:sticky left-0 top-0 h-screen w-[280px] flex flex-col py-8 px-4 bg-slate-50 border-r border-slate-200 z-50 transform transition-transform duration-300 ease-in-out md:translate-x-0"
  [class.-translate-x-full]="!isSidebarOpen"
  [class.translate-x-0]="isSidebarOpen"
  [class.pointer-events-none]="!isSidebarOpen"
>
  <button
    (click)="closeSidebar()"
    class="md:hidden absolute top-6 right-4 p-2 text-slate-400 hover:text-red-500 transition-colors"
  >
    <span class="material-symbols-outlined">close</span>
  </button>

  <div class="container-fluid mb-6">
    <a class="navbar-brand d-flex align-items-center" href="#" style="color: #1d4ed8">
      <i class="fas fa-hospital me-2"></i>
      <div>
        <div class="fw-bold text-dark">Piedra Azul</div>
        <div class="text-muted text-extra-small mt-0" style="font-size: small">
          Red de Servicios
        </div>
      </div>
    </a>
  </div>

  <nav class="flex-1 space-y-2 mt-4">
    <a
      routerLink="/home"
      routerLinkActive="text-blue-600 bg-white shadow-sm"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeSidebar()"
      class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-blue-500 hover:bg-blue-50/50 transition-all duration-200 rounded-lg font-bold"
    >
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-sans text-[14px]">Inicio</span>
    </a>

    @if (authService.isEspecialista()) {
      <a
        routerLink="/agendar"
        routerLinkActive="text-blue-600 bg-white shadow-sm"
        (click)="closeSidebar()"
        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-blue-500 hover:bg-blue-50/50 transition-all duration-200 rounded-lg font-bold"
      >
        <span class="material-symbols-outlined">calendar_today</span>
        <span class="font-sans text-[14px]">Agendar Cita</span>
      </a>

      <a
        routerLink="/mis-citas"
        routerLinkActive="text-blue-600 bg-white shadow-sm"
        (click)="closeSidebar()"
        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-blue-500 hover:bg-blue-50/50 transition-all duration-200 rounded-lg font-bold"
      >
        <span class="material-symbols-outlined">medical_services</span>
        <span class="font-sans text-[14px]">Mis citas</span>
      </a>
    }

    @if (authService.isAdmin()) {
      <a
        routerLink="/administrador"
        routerLinkActive="text-blue-600 bg-white shadow-sm"
        (click)="closeSidebar()"
        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-blue-500 hover:bg-blue-50/50 transition-all duration-200 rounded-lg font-bold"
      >
        <span class="material-symbols-outlined">settings</span>
        <span class="font-sans text-[14px]">Configuración</span>
      </a>
    }
  </nav>

  <div class="mt-auto pt-8 border-t border-slate-200 space-y-2">
    @if (authService.isEspecialista()) {
      <button
        routerLink="/agendar"
        (click)="closeSidebar()"
        class="w-full bg-blue-600 text-white rounded-lg py-3 px-4 font-bold text-[14px] flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 active:scale-95 transition-all"
      >
        <span class="material-symbols-outlined text-[20px]">add</span>
        Nueva Cita
      </button>
    }

    <div class="pt-4 space-y-1">
      <a
        (click)="authService.logout(); closeSidebar()"
        class="flex items-center gap-3 px-4 py-2 text-slate-500 hover:text-red-500 transition-colors cursor-pointer"
      >
        <span class="material-symbols-outlined">logout</span>
        <span class="font-sans font-bold text-[14px]">Cerrar Sesión</span>
      </a>
    </div>
  </div>
</aside>
